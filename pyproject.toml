[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qualiagent-enterprise"
version = "1.0.0"
description = "Enterprise Autonomous Quality Engineering (Agentic QE) & AI-Assisted Delivery Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Nandini", email = "candidate@example.com"}
]
keywords = [
    "agentic-ai",
    "quality-engineering",
    "autonomous-testing",
    "self-healing-tests",
    "rag",
    "llm-as-a-judge",
    "enterprise-ai",
    "devops"
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "streamlit>=1.41.0",
    "pydantic>=2.10.0",
    "pytest>=8.0.0",
    "faiss-cpu>=1.8.0",
    "rich>=13.9.0",
    "click>=8.1.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0"
]

[project.scripts]
qualiagent = "qualiagent.cli:cli"
