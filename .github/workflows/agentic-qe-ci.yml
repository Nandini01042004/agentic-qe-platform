name: Enterprise Agentic QE & CI/CD Delivery Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  agentic-qe-audit:
    name: Autonomous Quality Engineering & AI Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Core Platform Unit Tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Execute Autonomous Agentic QE Analysis
        run: |
          python -m qualiagent.cli analyze examples/sample_code/auth_service.py
          python -m qualiagent.cli analyze examples/sample_code/payment_gateway.py

      - name: Execute End-to-End Test Synthesis & Quality Scorecard
        run: |
          python -m qualiagent.cli run examples/sample_code/auth_service.py -o tests/generated_test_auth.py
          python -m qualiagent.cli run examples/sample_code/payment_gateway.py -o tests/generated_test_payment.py

      - name: Upload Generated Quality Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qe-generated-test-suites
          path: tests/generated_test_*.py
